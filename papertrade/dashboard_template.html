<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jev Paper Trader</title>
<meta name="description" content="Five AI strategies bet $100,000 of fake money each on real Polymarket and Kalshi markets. Live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* A single dark look on purpose: a mission-control screen. */
:root {
  color-scheme: dark;
  --bg: #03070a; --panel: rgba(8, 20, 28, 0.82); --panel-2: rgba(12, 30, 40, 0.9);
  --line: rgba(54, 226, 255, 0.16); --line-2: rgba(54, 226, 255, 0.32);
  --cyan: #36e2ff; --cyan-2: #8ff0ff; --cyan-dim: #4f9fb0;
  --ink: #e6f7fb; --ink-2: #9dbac2; --muted: #5d7b84; --grid: rgba(54, 226, 255, 0.07);
  /* strategies: the validated categorical steps for dark surfaces, fixed per strategy */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s0: #6f7872;
  --good: #19c37d; --critical: #ff5b5b; --warning: #fab219;
  --display: "Chakra Petch", "Eurostile", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--mono); font-size: 13px; line-height: 1.4;
       padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 44px 44px; -webkit-mask-image: radial-gradient(ellipse at 50% 35%, #000 30%, transparent 80%); mask-image: radial-gradient(ellipse at 50% 35%, #000 30%, transparent 80%); }
body::after { content: ""; position: fixed; left: 0; right: 0; top: -160px; height: 160px; pointer-events: none; z-index: 30;
  background: linear-gradient(180deg, transparent, rgba(54, 226, 255, 0.05), transparent); }
@media (prefers-reduced-motion: no-preference) { body::after { animation: sweep 11s linear infinite; } }
@keyframes sweep { to { transform: translateY(calc(100vh + 160px)); } }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--cyan-2); }
:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }

.hud { position: relative; z-index: 1; height: 100vh; min-height: 700px; padding: 12px 16px; display: grid; gap: 12px;
       grid-template-columns: 300px minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr) 236px auto; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px 22px; flex-wrap: wrap; padding: 4px 2px; }
#p-strat { grid-column: 1; grid-row: 2; }
#p-equity { grid-column: 2; grid-row: 2; }
#p-feed { grid-column: 3; grid-row: 2 / 4; }
#p-risk { grid-column: 1; grid-row: 3; }
#p-open { grid-column: 2; grid-row: 3; }
.bottom { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap;
          font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.example { grid-column: 1 / -1; background: var(--warning); color: #111; padding: 6px 12px; font-weight: 700; letter-spacing: 0.06em; }
@media (max-width: 1150px) {
  .hud { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  #p-strat, #p-equity, #p-feed, #p-risk, #p-open { grid-column: 1; grid-row: auto; }
  #p-equity { height: 380px; } #p-feed { height: 460px; } #p-open { height: 250px; }
}

/* panels with corner brackets */
.panel { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px;
         display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; overflow: hidden;
         box-shadow: inset 0 0 40px rgba(54, 226, 255, 0.03); }
.panel::before { content: ""; position: absolute; inset: -1px; pointer-events: none; --c: var(--cyan);
  background:
    linear-gradient(var(--c), var(--c)) top left / 16px 2px no-repeat, linear-gradient(var(--c), var(--c)) top left / 2px 16px no-repeat,
    linear-gradient(var(--c), var(--c)) top right / 16px 2px no-repeat, linear-gradient(var(--c), var(--c)) top right / 2px 16px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 16px 2px no-repeat, linear-gradient(var(--c), var(--c)) bottom left / 2px 16px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom right / 16px 2px no-repeat, linear-gradient(var(--c), var(--c)) bottom right / 2px 16px no-repeat; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--display); font-weight: 600;
      font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cyan-dim); flex: none; }
.ph b { color: var(--cyan); font-weight: 600; }
.ph .r { font-family: var(--mono); letter-spacing: 0.06em; font-size: 11px; color: var(--muted); font-weight: 400; text-transform: none; }
.blink { width: 7px; height: 7px; background: var(--cyan); display: inline-block; box-shadow: 0 0 8px var(--cyan); }
@media (prefers-reduced-motion: no-preference) {
  .blink { animation: blink 1.6s steps(2, start) infinite; }
  .intro .panel { animation: boot 520ms cubic-bezier(.2, .7, .2, 1) both; }
  .intro #p-strat { animation-delay: 60ms; } .intro #p-equity { animation-delay: 140ms; } .intro #p-feed { animation-delay: 220ms; }
  .intro #p-risk { animation-delay: 300ms; } .intro #p-open { animation-delay: 380ms; }
}
@keyframes blink { to { visibility: hidden; } }
@keyframes boot { from { opacity: 0; transform: translateY(8px); clip-path: inset(0 0 100% 0); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); } }

/* top bar */
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: 0.12em; }
.logo svg { filter: drop-shadow(0 0 6px rgba(54, 226, 255, 0.6)); }
.logo i { font-style: normal; color: var(--cyan); }
.tag { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan-dim); border: 1px solid var(--line); padding: 3px 8px; border-radius: 2px; white-space: nowrap; }
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat span { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.stat b { font-weight: 500; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.live { display: inline-flex; align-items: center; gap: 7px; color: var(--good); font-weight: 700; letter-spacing: 0.14em; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; }
.live.stale { color: var(--warning); }
@media (prefers-reduced-motion: no-preference) { .live i { animation: pulse 1.8s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: 0.3; } }
.clock { margin-left: auto; text-align: right; }
.clock b { font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: 0.06em; color: var(--cyan-2); text-shadow: 0 0 14px rgba(54, 226, 255, 0.45); }

/* strategies */
.strats { display: flex; flex-direction: column; overflow-y: auto; min-height: 0; }
.srow { display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); align-items: center; }
.srow:last-child { border-bottom: 0; }
.srow .bar { grid-row: 1 / 3; align-self: stretch; border-radius: 2px; }
.srow .nm { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: 0.04em; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.srow .nm small { font-family: var(--mono); font-weight: 400; font-size: 9.5px; color: var(--muted); letter-spacing: 0.1em; }
.srow .v { font-size: 15px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.srow .d { grid-column: 2 / 4; display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.srow.lead .v { color: var(--cyan-2); text-shadow: 0 0 12px rgba(54, 226, 255, 0.5); }
.up { color: var(--good); } .down { color: var(--critical); } .flat { color: var(--muted); }
.spark { width: 70px; height: 18px; flex: none; }

/* equity */
.eq-head { display: flex; align-items: flex-end; gap: 10px 28px; flex-wrap: wrap; flex: none; }
.big { font-family: var(--display); font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: 0.02em; color: var(--cyan-2);
       text-shadow: 0 0 18px rgba(54, 226, 255, 0.45); font-variant-numeric: tabular-nums; }
.chart { position: relative; flex: 1; min-height: 0; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tick { font-size: 10.5px; fill: var(--muted); font-family: var(--mono); }
.dl { font-size: 10.5px; font-family: var(--display); font-weight: 600; letter-spacing: 0.04em; }
@media (prefers-reduced-motion: no-preference) {
  .draw path.ln { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.6s cubic-bezier(.3, .6, .2, 1) 300ms forwards; }
  .ring-pulse { animation: ring 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  .scanx { animation: scanx 7s linear infinite; }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes ring { from { transform: scale(1); opacity: 0.9; } to { transform: scale(3.2); opacity: 0; } }
@keyframes scanx { from { transform: translateX(0); } to { transform: translateX(var(--scan-w, 600px)); } }
.tip { position: absolute; z-index: 5; pointer-events: none; background: rgba(4, 14, 20, 0.96); border: 1px solid var(--line-2); padding: 8px 10px;
       font-size: 11.5px; display: grid; gap: 3px; min-width: 190px; box-shadow: 0 0 24px rgba(54, 226, 255, 0.15); }
.tip .r { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.tip .sw { width: 10px; height: 2px; }
.tip .w { color: var(--muted); font-size: 10.5px; }

/* exposure */
.risk { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: center; flex: 1; min-height: 0; }
.gauge { position: relative; width: 116px; height: 116px; }
.gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.gauge .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.gauge .c b { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--cyan-2); }
.gauge .c span { font-size: 9.5px; letter-spacing: 0.16em; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .gauge circle.arc { transition: stroke-dashoffset 1.2s cubic-bezier(.3, .6, .2, 1); } }
.kv { display: grid; gap: 5px; font-size: 11.5px; }
.kv div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
.kv span { color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
.kv b { font-weight: 500; font-variant-numeric: tabular-nums; }

/* open positions */
.cards { display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; flex: 1; min-height: 0; padding-bottom: 4px; scrollbar-color: var(--line-2) transparent; }
.card { flex: 0 0 218px; border: 1px solid var(--line); background: var(--panel-2); padding: 10px; display: grid; grid-template-rows: auto 1fr auto; gap: 7px; min-height: 0; }
.card .hd { display: flex; gap: 10px; align-items: center; }
.cd { position: relative; width: 46px; height: 46px; flex: none; }
.cd svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.cd b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10.5px; font-weight: 500; color: var(--cyan-2); }
.card .who { display: grid; gap: 2px; font-size: 11px; min-width: 0; }
.card .who .s { font-family: var(--display); font-weight: 600; letter-spacing: 0.06em; display: flex; gap: 6px; align-items: center; }
.card .who .s i { width: 8px; height: 8px; border-radius: 50%; }
.card .who .p { color: var(--ink-2); }
.card .q { font-size: 11.5px; color: var(--ink); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .m { display: flex; justify-content: space-between; font-size: 11.5px; font-variant-numeric: tabular-nums; border-top: 1px dashed var(--line); padding-top: 6px; }
.none { color: var(--muted); font-size: 12px; border: 1px dashed var(--line); padding: 14px; flex: 1; display: grid; place-content: center; text-align: center; letter-spacing: 0.06em; }

/* feed */
.feed { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; scrollbar-color: var(--line-2) transparent;
        -webkit-mask-image: linear-gradient(180deg, #000 88%, transparent); mask-image: linear-gradient(180deg, #000 88%, transparent); }
.fl { display: grid; grid-template-columns: 40px 52px minmax(0, 1fr); gap: 8px; padding: 6px 2px; border-bottom: 1px solid rgba(54, 226, 255, 0.07); font-size: 11.5px; }
.fl .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.fl .k { font-weight: 700; letter-spacing: 0.08em; font-size: 10.5px; padding-top: 1px; }
.fl .x { color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.fl .x b { color: var(--ink); font-weight: 500; }
.k-bet { color: var(--cyan); } .k-win { color: var(--good); } .k-loss { color: var(--critical); } .k-scan { color: var(--cyan-dim); }
.k-intel { color: #9085e9; } .k-call { color: var(--ink); } .k-learn, .k-review { color: #e87ba4; } .k-problem { color: var(--warning); }
.cursor { color: var(--cyan); padding: 2px 2px 6px; font-size: 12px; }
@media (prefers-reduced-motion: no-preference) {
  .cursor::after { content: "█"; animation: blink 1s steps(2, start) infinite; }
  .intro .fl { animation: type 380ms steps(18, end) both; }
  .fl.new { animation: flash 2.4s ease-out both; }
}
@keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes flash { from { background: rgba(54, 226, 255, 0.22); } to { background: transparent; } }

/* bottom bar + verify */
.learn { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
.learn b { color: var(--ink); font-weight: 500; }
.lbar { display: inline-block; width: 70px; height: 4px; background: rgba(54, 226, 255, 0.12); vertical-align: middle; margin-left: 6px; }
.lbar i { display: block; height: 100%; background: var(--s5); box-shadow: 0 0 6px var(--s5); }
.btns { display: flex; gap: 8px; }
.btn { font: inherit; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); background: transparent;
       border: 1px solid var(--line-2); padding: 5px 10px; cursor: pointer; border-radius: 2px; }
.btn:hover { background: rgba(54, 226, 255, 0.08); color: var(--cyan-2); }
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(1, 4, 6, 0.8); display: grid; place-items: center; padding: 16px; }
.modal { max-width: 620px; width: 100%; background: #06121a; border: 1px solid var(--line-2); padding: 20px 22px; display: grid; gap: 12px;
         box-shadow: 0 0 60px rgba(54, 226, 255, 0.15); font-size: 13px; color: var(--ink-2); max-height: calc(100vh - 32px); overflow-y: auto; }
.modal h2 { margin: 0; font-family: var(--display); color: var(--ink); letter-spacing: 0.1em; font-size: 16px; text-transform: uppercase; }
.modal p { margin: 0; } .modal p b { color: var(--ink); }
.modal .links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11.5px; }
.modal .links a { color: var(--cyan); }
</style>
</head>

<div class="hud intro" id="hud">
  <header class="top" id="top"></header>
  <section class="panel" id="p-strat" aria-labelledby="h-strat"><div class="ph" id="h-strat"><span><b>Strategies</b></span><span class="r" id="strat-r"></span></div><div class="strats" id="strats"></div></section>
  <section class="panel" id="p-equity" aria-labelledby="h-eq"><div class="ph" id="h-eq"><span><b>Equity</b> // marked to market</span><span class="r" id="eq-r"></span></div><div class="eq-head" id="eq-head"></div><div class="chart" id="chart"><div class="tip" id="tip" hidden></div></div></section>
  <section class="panel" id="p-feed" aria-labelledby="h-feed"><div class="ph" id="h-feed"><span><i class="blink"></i> <b>Live feed</b></span><span class="r" id="feed-r"></span></div><div class="feed" id="feed" aria-live="polite"></div></section>
  <section class="panel" id="p-risk" aria-labelledby="h-risk"><div class="ph" id="h-risk"><span><b>Exposure</b></span><span class="r" id="risk-r"></span></div><div class="risk" id="risk"></div></section>
  <section class="panel" id="p-open" aria-labelledby="h-open"><div class="ph" id="h-open"><span><b>Open positions</b></span><span class="r" id="open-r"></span></div><div class="cards" id="cards"></div></section>

</div>

<script>
"use strict";
const TZ = "America/New_York";  // shown as ET; the browser switches between EST and EDT
const NS = "http://www.w3.org/2000/svg";
const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const SLOTS = [8, 23, 38, 53], GAP_MIN = 25;  // the workflow's schedule and its minimum gap between cycles
let D = null, seenFeed = null, prevVals = {};

const $ = id => document.getElementById(id);
const usd0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const usd2 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v, d = 0) => v == null ? "—" : `${(v * 100).toFixed(d)}%`;
const cents = v => v == null ? "—" : `${(v * 100).toFixed(v * 100 < 10 ? 1 : 0)}¢`;
const signed = (v, f = usd0) => (v > 0 ? "+" : v < 0 ? "−" : "±") + f.format(Math.abs(v));
const hm = iso => new Date(iso).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ });
const when = iso => iso ? new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: TZ }) + " ET" : "—";
const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const k in props) {
    if (props[k] == null) continue;
    if (k === "class") e.className = props[k]; else if (k === "text") e.textContent = props[k];
    else if (k === "style") e.style.cssText = props[k]; else e.setAttribute(k, props[k]);
  }
  kids.forEach(c => c != null && e.append(c));
  return e;
};
const s = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const safeUrl = u => (typeof u === "string" && u.startsWith("https://")) ? u : null;
const link = (url, text, cls) => { const u = safeUrl(url); return u ? h("a", { class: cls, href: u, target: "_blank", rel: "noopener noreferrer", text }) : h("span", { class: cls, text }); };
const niceStep = raw => { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };
const arrow = v => v > 0.00004 ? "▲" : v < -0.00004 ? "▼" : "■";
const dir = v => v > 0.00004 ? "up" : v < -0.00004 ? "down" : "flat";

// Numbers roll to their new value, like an instrument settling.
function roll(el, key, to, fmt) {
  const from = prevVals[key] ?? to * 0.985;
  prevVals[key] = to;
  if (REDUCED || from === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 900;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function render(data, { update = false } = {}) {
  D = data;
  const strategies = D.strategies || [];
  const S = Object.fromEntries(strategies.map(r => [r.name, r]));
  const col = name => `var(--s${(S[name] || {}).slot || 0})`;
  const label = name => (S[name] || {}).short || (S[name] || {}).label || name;
  const worth = r => r.marked ?? r.equity;
  const total = strategies.reduce((a, r) => a + worth(r), 0);
  const start = (D.start || 100000) * (strategies.length || 1);
  const inPlay = strategies.reduce((a, r) => a + (r.open_cost || 0), 0);
  const hud = $("hud");
  if (update) hud.classList.remove("intro");

  // ---------- top bar ----------
  const top = $("top"); top.textContent = "";
  const logo = h("div", { class: "logo" });
  const mark = s("svg", { width: 26, height: 26, viewBox: "0 0 26 26", "aria-hidden": "true" });

function spark(points, color, startVal) {
  const svg = s("svg", { class: "spark", viewBox: "0 0 70 18", preserveAspectRatio: "none", "aria-hidden": "true" });
  if (!points || points.length < 2) return svg;
  const vs = points.map(p => p[1]), lo = Math.min(startVal, ...vs), hi = Math.max(startVal, ...vs), span = hi - lo || 1;
  const X = i => i / (points.length - 1) * 70, Y = v => 16 - (v - lo) / span * 14;
  s("line", { x1: 0, x2: 70, y1: Y(startVal), y2: Y(startVal), stroke: "rgba(54,226,255,0.25)", "stroke-dasharray": "2 2", "vector-effect": "non-scaling-stroke" }, svg);
  s("path", { d: vs.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" "), fill: "none", stroke: color, "stroke-width": 1.5, "vector-effect": "non-scaling-stroke" }, svg);
  return svg;
}

function feedLine(e, col, label) {

    case "win": x.append(h("b", { class: "up", text: signed(e.amount) }), document.createTextNode(` ${label(e.strategy)} · `), q(e.q)); break;
    case "loss": x.append(h("b", { class: "down", text: signed(e.amount) }), document.createTextNode(` ${label(e.strategy)} · `), q(e.q)); break;
    case "scan": x.append(document.createTextNode(`${e.fetched} markets → ${e.judged} judged → ${e.researched} researched → `), h("b", { text: `${e.bets} bet${e.bets === 1 ? "" : "s"}` })); break;
    case "intel": k = "INTEL"; x.append(h("b", { text: `${e.facts} facts ` }), q(e.q)); break;
    case "call": x.append(h("b", { text: `Jev ${pct(e.jev)}` }), document.createTextNode(`${e.claude != null ? ` · Claude ${pct(e.claude)}` : ""} · mkt ${pct(e.market)} `), q(e.q)); break;
    case "review": k = e.kind === "win" ? "WHY ✓" : "WHY ✗"; x.append(h("b", { text: String(e.cause).replace(/_/g, " ") + " " }), q(e.q)); break;

}

function drawChart(update, S, col, label) {
  const box = $("chart"), tip = $("tip");
  box.querySelectorAll("svg").forEach(x => x.remove());
  const series = (D.race || []).filter(r => S[r.name]).map(r => ({ name: r.name, pts: r.points.map(([t, v]) => ({ x: Date.parse(t), v })).filter(p => !Number.isNaN(p.x)) })).filter(r => r.pts.length);
  const all = series.flatMap(r => r.pts);
  if (!all.length) return;
  const W = Math.max(300, box.clientWidth), H = Math.max(160, box.clientHeight), L = 58, R = 104, T = 8, B = 22;
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, class: update || REDUCED ? "" : "draw", role: "img",
    "aria-label": "Equity race: " + series.map(r => `${label(r.name)} ${usd0.format(r.pts[r.pts.length - 1].v)}`).join(", ") });
  box.insertBefore(svg, tip);
  const defs = s("defs", {}, svg);
  // sized to the whole chart: a filter sized to its line vanishes when the line is flat (zero-height box)
  const f = s("filter", { id: "glow", filterUnits: "userSpaceOnUse", x: 0, y: 0, width: W, height: H }, defs);
  s("feGaussianBlur", { stdDeviation: 2.6, result: "b" }, f);
  const fm = s("feMerge", {}, f); s("feMergeNode", { in: "b" }, fm); s("feMergeNode", { in: "SourceGraphic" }, fm);
  const grad = s("linearGradient", { id: "fade", x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
  s("stop", { offset: "0%", "stop-color": "#36e2ff", "stop-opacity": 0.16 }, grad); s("stop", { offset: "100%", "stop-color": "#36e2ff", "stop-opacity": 0 }, grad);
  const sg = s("linearGradient", { id: "sweepGrad", x1: 0, x2: 1, y1: 0, y2: 0 }, defs);
  s("stop", { offset: "0%", "stop-color": "#36e2ff", "stop-opacity": 0 }, sg); s("stop", { offset: "100%", "stop-color": "#36e2ff", "stop-opacity": 0.12 }, sg);
  let x0 = Math.min(...all.map(p => p.x)), x1 = Math.max(...all.map(p => p.x));
  if (x1 - x0 < 3 * 3600000) x1 = x0 + 3 * 3600000;
  let lo = Math.min(D.start, ...all.map(p => p.v)), hi = Math.max(D.start, ...all.map(p => p.v));
  const pad = Math.max((hi - lo) * 0.14, D.start * 0.004), step = niceStep((hi - lo + 2 * pad) / 4);
  lo = Math.floor((lo - pad) / step) * step; hi = Math.ceil((hi + pad) / step) * step;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const kfmt = v => { const a = v / 1000; return "$" + (Number.isInteger(a) ? a : a.toFixed(1)) + "k"; };
  for (let v = lo; v <= hi + step / 2; v += step) {
    s("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: "rgba(54,226,255,0.08)" }, svg);
    s("text", { x: L - 8, y: Y(v) + 4, "text-anchor": "end", class: "tick" }, svg).textContent = kfmt(v);
  }
  const spanH = (x1 - x0) / 3600000, nT = W < 600 ? 3 : 6;
  for (let i = 0; i <= nT; i++) {
    const v = x0 + (x1 - x0) * i / nT, iso = new Date(v).toISOString();
    s("line", { x1: X(v), x2: X(v), y1: T, y2: H - B, stroke: "rgba(54,226,255,0.05)" }, svg);
    s("text", { x: X(v), y: H - 5, "text-anchor": i === 0 ? "start" : i === nT ? "end" : "middle", class: "tick" }, svg).textContent =
      spanH <= 36 ? hm(iso) : new Date(v).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: TZ });
  }
  s("line", { x1: L, x2: W - R, y1: Y(D.start), y2: Y(D.start), stroke: "rgba(143,240,255,0.45)", "stroke-dasharray": "4 5" }, svg);
  s("text", { x: L + 6, y: Y(D.start) - 6, class: "tick" }, svg).textContent = "START";
  // the headline strategy gets an area glow and is drawn on top
  const order = series.slice().sort((a, b) => (S[a.name].main ? 1 : 0) - (S[b.name].main ? 1 : 0));
  const path = r => r.pts.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(" ");
  const mainS = series.find(r => S[r.name].main);
  if (mainS) s("path", { d: `${path(mainS)} L${X(mainS.pts[mainS.pts.length - 1].x).toFixed(1)} ${H - B} L${X(mainS.pts[0].x).toFixed(1)} ${H - B} Z`, fill: "url(#fade)" }, svg);
  order.forEach(r => {
    s("path", { class: "ln", d: path(r), pathLength: 1, fill: "none", stroke: col(r.name), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", filter: "url(#glow)" }, svg);
    const e = r.pts[r.pts.length - 1];
    s("circle", { class: "ring-pulse", cx: X(e.x), cy: Y(e.v), r: 4, fill: "none", stroke: col(r.name), "stroke-width": 1.5 }, svg);
    s("circle", { cx: X(e.x), cy: Y(e.v), r: 3.5, fill: col(r.name), stroke: "#03070a", "stroke-width": 1.5 }, svg);
  });
  // direct labels: every strategy named in its own color, nudged apart where lines sit together
  const ends = order.map(r => ({ name: r.name, y: Y(r.pts[r.pts.length - 1].v) })).sort((a, b) => a.y - b.y);
  let prev = -Infinity;
  ends.forEach(e => {
    const y = Math.max(e.y, prev + 13); prev = y;
    s("text", { x: W - R + 10, y: y + 4, class: "dl", fill: col(e.name) }, svg).textContent = label(e.name).toUpperCase();
  });
  // a scan line sweeping the plot, like a radar trace
  if (!REDUCED) {
    const g = s("g", { class: "scanx", style: `--scan-w:${W - L - R}px` }, svg);
    s("rect", { x: L - 30, y: T, width: 30, height: H - T - B, fill: "url(#sweepGrad)" }, g);
    s("line", { x1: L, x2: L, y1: T, y2: H - B, stroke: "#36e2ff", "stroke-opacity": 0.35 }, g);
  }
  // crosshair and readout
  const cross = s("line", { y1: T, y2: H - B, stroke: "#8ff0ff", "stroke-opacity": 0.6, visibility: "hidden" }, svg);
  const hit = s("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent", tabindex: 0, "aria-label": "Move across the chart to read values" }, svg);
  const times = [...new Set(all.map(p => p.x))].sort((a, b) => a - b);
  const show = x => {
    const t = times.reduce((best, v) => Math.abs(v - x) < Math.abs(best - x) ? v : best, times[0]);
    cross.setAttribute("x1", X(t)); cross.setAttribute("x2", X(t)); cross.setAttribute("visibility", "visible");
    const rows = series.map(r => ({ name: r.name, v: (r.pts.filter(p => p.x <= t).pop() || r.pts[0]).v })).sort((a, b) => b.v - a.v);
    tip.textContent = "";
    tip.append(h("div", { class: "w", text: when(new Date(t).toISOString()) }));
    rows.forEach(r => tip.append(h("div", { class: "r" }, h("span", { class: "sw", style: `background:${col(r.name)}` }), h("span", { text: label(r.name) }), h("b", { text: usd0.format(r.v) }))));
    tip.hidden = false;
    const bw = box.clientWidth, tw = tip.offsetWidth, px = X(t) / W * bw;
    tip.style.left = `${px + 14 + tw > bw ? px - tw - 14 : px + 14}px`; tip.style.top = "6px";
  };
  hit.addEventListener("pointermove", ev => { const r = svg.getBoundingClientRect(); show(x0 + ((ev.clientX - r.left) / r.width * W - L) / (W - L - R) * (x1 - x0)); });
  const hide = () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointerleave", hide); hit.addEventListener("blur", hide);
  hit.addEventListener("focus", () => show(times[times.length - 1]));
}

  close.focus();
}
$("verify").addEventListener("click", e => { if (e.target.id === "verify") $("verify").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("verify").hidden = true; });

// Every second: the clock, the next-scan countdown, and each open bet's time left.
function tick() {
  const now = new Date();
  const c = $("clock"); if (c) c.textContent = now.toLocaleTimeString("en-US", { hour12: false, timeZone: TZ });
  const d = $("date"); if (d) d.textContent = now.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: TZ }) + " · ET";
  const ns = $("next-scan");
  if (ns) {
    const earliest = Math.max(Date.now(), Date.parse(ns.dataset.last) + GAP_MIN * 60000);
    const t = new Date(earliest); t.setUTCSeconds(0, 0);
    while (!SLOTS.includes(t.getUTCMinutes()) || t.getTime() < earliest) t.setTime(t.getTime() + 60000);
    const left = Math.max(0, t.getTime() - Date.now());
    ns.textContent = `${hm(t.toISOString())} · ${String(Math.floor(left / 60000)).padStart(2, "0")}:${String(Math.floor(left / 1000) % 60).padStart(2, "0")}`;
  }
  document.querySelectorAll("[data-ring]").forEach(r => {
    const o = Date.parse(r.dataset.open), cl = Date.parse(r.dataset.close), C = 2 * Math.PI * 20;
    const frac = Math.min(1, Math.max(0, (cl - Date.now()) / Math.max(1, cl - o)));
    r.setAttribute("stroke-dashoffset", C * (1 - frac));
  });
  document.querySelectorAll("[data-left]").forEach(b => {
    const ms = Date.parse(b.dataset.left) - Date.now(), hrs = ms / 3600000;
    b.textContent = ms <= 0 ? "DONE" : hrs < 1 ? `${Math.floor(ms / 60000)}m` : hrs < 48 ? `${Math.floor(hrs)}h` : `${Math.round(hrs / 24)}d`;
  });
}
setInterval(tick, 1000);

let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => D && render(D, { update: true }), 200); });

// The public page loads the latest data from the GitHub repo when it opens and every 5 minutes after,
// and falls back to the copy built into the page. Anything marked as example data is never shown there.
(function boot() {
  const EMBED = JSON.parse(document.getElementById("data").textContent);
  if (!EMBED.data_url || !EMBED.data_url.startsWith("https://")) return render(EMBED);
  const load = first => {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
    // a per-minute query string gets past GitHub's 5-minute file cache without hammering it
    return fetch(`${EMBED.data_url}?m=${Math.floor(Date.now() / 60000)}`, { signal: ctl.signal, cache: "no-store" })
      .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
      .then(d => {
        if (d.example) throw new Error("example data");
        const fresh = Object.assign(d, { data_url: EMBED.data_url, ledger_base: d.ledger_base || EMBED.ledger_base, live: true });
        if (first || !D || fresh.generated !== D.generated) render(fresh, { update: !first });
      })
      .catch(() => { if (first) render(Object.assign(EMBED, { live: false })); })
      .finally(() => clearTimeout(timer));
  };
  load(true);
  setInterval(() => load(false), 5 * 60000);
})();
</script>
