<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jev Paper Trader</title>
<meta name="description" content="Five AI strategies bet $100,000 of fake money each on real Polymarket and Kalshi markets. Live results, every bet, and what it's learning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  color-scheme: light;
  --page: #eef0ec; --surface: #fbfcfa; --raised: #ffffff; --wash: #e5e9e3;
  --ink: #111513; --ink-2: #4b534e; --muted: #7c847e;
  --grid: #e0e4de; --axis: #c0c7c0; --hairline: rgba(17, 21, 19, 0.11);
  /* the scoreboard is dark in both themes, so its series use the dark-validated steps */
  --board: #121715; --board-2: #1b221f; --board-ink: #f3f6f2; --board-ink-2: #a8b2ac; --board-muted: #7d8882;
  --board-line: rgba(255, 255, 255, 0.09); --board-grid: #26302b;
  /* strategies: validated categorical slots, fixed per strategy (color follows the strategy, never its rank) */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s0: #9aa19c;
  --b1: #3987e5; --b2: #d95926; --b3: #199e70; --b4: #c98500; --b5: #d55181; --b6: #008300; --b7: #9085e9; --b0: #6f7872;
  --good: #0ca30c; --good-text: #006300; --critical: #d03b3b; --critical-text: #b42f2f; --warning: #fab219;
  --focus: #2a78d6;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0b0e0d; --surface: #151a18; --raised: #1c2220; --wash: #222a26;
    --ink: #f1f4f1; --ink-2: #b8c1bb; --muted: #838c86;
    --grid: #252c28; --axis: #38423d; --hairline: rgba(255, 255, 255, 0.09);
    --board: #111614; --board-2: #1a211e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s0: #6f7872;
    --good-text: #0ca30c; --critical-text: #e66767; --focus: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b0e0d; --surface: #151a18; --raised: #1c2220; --wash: #222a26;
  --ink: #f1f4f1; --ink-2: #b8c1bb; --muted: #838c86;
  --grid: #252c28; --axis: #38423d; --hairline: rgba(255, 255, 255, 0.09);
  --board: #111614; --board-2: #1a211e;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s0: #6f7872;
  --good-text: #0ca30c; --critical-text: #e66767; --focus: #3987e5;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5;
       padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.inner { max-width: 1120px; margin: 0 auto; padding-inline: 20px; }
@media (max-width: 480px) { .inner { padding-inline: 16px; } }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.example-banner { background: var(--warning); color: #111513; font-weight: 600; padding-block: 10px; font-size: 14px; }

/* ---------- the scoreboard ---------- */
.board { background: var(--board); color: var(--board-ink); border-bottom: 1px solid var(--board-line); }
.board .inner { padding-block: 22px 28px; display: grid; gap: 22px; }
.masthead { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.wordmark .j { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--board-ink); color: var(--board);
               font-size: 17px; font-weight: 800; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px;
        border: 1px solid var(--board-line); color: var(--board-ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.chip.stale { color: #111513; background: var(--warning); border-color: transparent; }
.chip.stale .dot { background: #111513; }
@media (prefers-reduced-motion: no-preference) { .chip.live .dot { animation: pulse 2.4s ease-in-out infinite; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.thesis { font-family: var(--display); font-weight: 600; font-size: clamp(24px, 3.6vw, 38px); line-height: 1.12; letter-spacing: -0.02em;
          max-width: 27ch; }
.thesis em { font-style: normal; color: var(--board-ink-2); }
.board-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 20px 28px; align-items: start; }
@media (max-width: 900px) { .board-grid { grid-template-columns: minmax(0, 1fr); } }
.standings { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.standings li { display: grid; grid-template-columns: 30px 4px minmax(0, 1fr) auto; gap: 0 12px; align-items: center; padding: 10px 12px 10px 4px;
                border-radius: 10px; }
.standings li.lead { background: var(--board-2); }
.standings .rank { font-family: var(--mono); font-size: 13px; color: var(--board-muted); text-align: right; }
.standings .bar { width: 4px; align-self: stretch; border-radius: 4px; }
.standings .who { min-width: 0; display: grid; gap: 1px; }
.standings .name { font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.standings .tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--board-muted); }
.standings .blurb { font-size: 12.5px; color: var(--board-ink-2); line-height: 1.4; }
.standings .money { text-align: right; display: grid; gap: 1px; }
.standings .worth { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.standings .chg { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--board-ink-2); display: inline-flex; gap: 4px; align-items: center; justify-content: flex-end; }
.standings .rec { font-size: 11.5px; color: var(--board-muted); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .standings li { grid-template-columns: 26px 4px minmax(0, 1fr); grid-template-areas: "rank bar who" "rank bar money"; row-gap: 6px; }
  .standings .rank { grid-area: rank; align-self: start; padding-top: 2px; } .standings .bar { grid-area: bar; }
  .standings .who { grid-area: who; } .standings .money { grid-area: money; text-align: left; }
  .standings .chg { justify-content: flex-start; }
  .standings .money { grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline; } .standings .rec { grid-column: 1 / -1; }
}
.race { display: grid; gap: 8px; min-width: 0; }
.race h2 { font-family: var(--display); font-weight: 600; font-size: 15px; }
.race .note { font-size: 12.5px; color: var(--board-ink-2); max-width: 60ch; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.board .tick { font-size: 11px; fill: var(--board-muted); font-family: var(--sans); font-variant-numeric: tabular-nums; }
.board .lbl { font-size: 12px; fill: var(--board-ink-2); font-family: var(--sans); font-weight: 500; }
.tip { position: absolute; pointer-events: none; border-radius: 9px; padding: 9px 11px; font-size: 12.5px; width: max-content;
       max-width: min(300px, 82vw); display: grid; gap: 3px; z-index: 5; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28); }
.board .tip { background: #232c28; color: var(--board-ink); border: 1px solid var(--board-line); }
main .tip { background: var(--raised); color: var(--ink); border: 1px solid var(--hairline); }
.tip .row { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.tip .sw { width: 10px; height: 3px; border-radius: 2px; }
.tip .when { font-family: var(--mono); font-size: 11px; opacity: 0.75; }

/* ---------- sections ---------- */
main .inner { padding-block: 28px 56px; display: grid; gap: 40px; }
section.block { display: grid; gap: 14px; min-width: 0; }
.head { display: grid; gap: 4px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.head h2 { font-family: var(--display); font-weight: 700; font-size: clamp(21px, 2.4vw, 26px); letter-spacing: -0.015em; line-height: 1.15; }
.head p { color: var(--ink-2); font-size: 14px; max-width: 68ch; }
.empty { border: 1px dashed var(--axis); border-radius: 12px; padding: 16px 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 4px; }
.empty b { color: var(--ink); font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel h3 { font-size: 14px; font-weight: 600; }
.panel .sub { font-size: 13px; color: var(--muted); margin-top: -6px; }
.pill { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
        border: 1px solid var(--hairline); color: var(--ink-2); white-space: nowrap; }
.sdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.who-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.side { font-family: var(--mono); font-weight: 500; font-size: 12px; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--axis); color: var(--ink); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.status.win { color: var(--good-text); } .status.loss { color: var(--critical-text); }

/* results */
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.result { background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.result .q { font-weight: 600; font-size: 14.5px; line-height: 1.35; }
.result .m { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* open bets: ticket stubs */
.slips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.slip { display: grid; grid-template-columns: 76px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; min-width: 0; }
.stub { position: relative; display: grid; place-content: center; text-align: center; gap: 2px; padding: 12px 6px; border-right: 2px dashed var(--grid);
        background: var(--wash); border-radius: 13px 0 0 13px; }
.stub::before, .stub::after { content: ""; position: absolute; right: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--page); }
.stub::before { top: -9px; } .stub::after { bottom: -9px; }
.stub .t { font-family: var(--mono); font-weight: 500; font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stub .l { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.stub.soon .t { color: var(--critical-text); }
.slip .body { padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.slip .top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.slip .q { font-weight: 600; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
.pos { display: grid; gap: 6px; }
.pos .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; }
.pos .row .l { display: flex; gap: 8px; align-items: center; min-width: 0; flex-wrap: wrap; }
.pos .row .r { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .pos .row { grid-template-columns: minmax(0, 1fr); gap: 2px; } .pos .row .r { text-align: left; } .slip { grid-template-columns: 64px minmax(0, 1fr); } .stub .t { font-size: 16px; } }
.slip .why { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* latest calls */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .tickmark { width: 2px; height: 12px; background: var(--ink); border-radius: 1px; }
.calls { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--hairline); border-radius: 14px; }
.call { display: grid; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--hairline); min-width: 0; }
.call:first-child { border-top: 0; }
.call .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.call .q { font-weight: 600; font-size: 14.5px; line-height: 1.35; overflow-wrap: anywhere; }
.track { position: relative; height: 34px; margin-inline: 8px; }
.track .axis { position: absolute; left: 0; right: 0; top: 22px; height: 1px; background: var(--axis); }
.track .tk { position: absolute; top: 19px; width: 1px; height: 7px; background: var(--axis); }
.track .tl { position: absolute; top: 0; font-size: 10.5px; color: var(--muted); transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.track .mk { position: absolute; top: 9px; width: 3px; height: 26px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
.track .fd { position: absolute; top: 16px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--surface); }
.call .nums { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.call .decs { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; }
.dec { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.dec b { color: var(--ink); font-weight: 600; }
details.facts { font-size: 13px; }
details.facts summary { cursor: pointer; color: var(--ink-2); font-weight: 500; width: max-content; max-width: 100%; }
details.facts ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
details.facts li { display: grid; gap: 2px; padding-left: 12px; border-left: 2px solid var(--grid); }
details.facts .fm { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* learning */
.rules-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: none; }
.rules-list li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; font-size: 13.5px; }
.rules-list .id { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 1px; }
.rules-list .c { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.meter { height: 8px; border-radius: 999px; background: var(--wash); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--s5); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv div { display: grid; gap: 0; }
.kv b { font-family: var(--display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; }
.kv span { font-size: 12.5px; color: var(--muted); }
.story { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--hairline); font-size: 13.5px; }
.story:first-of-type { border-top: 0; padding-top: 0; }
.story .t { font-weight: 600; }
.story .m { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.story .x { color: var(--ink-2); }
.prop { display: grid; gap: 3px; padding: 10px 12px; border-radius: 10px; background: var(--wash); font-size: 13.5px; }
.prop .t { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
blockquote.retro { margin: 0; font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.3; }

/* tables and bars */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
th { font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bars { display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: minmax(96px, 150px) minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.bar-row .t { height: 10px; background: var(--wash); border-radius: 999px; overflow: hidden; }
.bar-row .t i { display: block; height: 100%; border-radius: 999px; }
.bar-row .n { text-align: right; }
.problems { display: grid; gap: 6px; font-size: 13px; }
.problems div { display: flex; gap: 8px; align-items: baseline; }
.trust { display: grid; gap: 10px; font-size: 14px; color: var(--ink-2); }
.trust b { color: var(--ink); font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--mono); font-size: 12px; }
footer { font-family: var(--mono); font-size: 11.5px; color: var(--muted); line-height: 1.7; }

/* a settled win gets a small celebration, once per viewer */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
         background: var(--ink); color: var(--page); padding: 12px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 12px 34px rgba(0,0,0,0.3);
         width: max-content; max-width: calc(100vw - 32px); display: flex; gap: 12px; align-items: center; }
.toast button { font: inherit; font-size: 13px; background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 8px; padding: 3px 9px; cursor: pointer; opacity: 0.8; }
canvas.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 19; }
</style>
</head>

<script>
const TZ = "America/New_York";  // shown as ET; the browser switches between EST and EDT
let DATA = null;

function render(D) {
  "use strict";
  DATA = D;
  const app = document.getElementById("app");
  app.textContent = "";
  const NS = "http://www.w3.org/2000/svg";
  const usd0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const usd2 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const int = new Intl.NumberFormat("en-US");
  const signed0 = v => (v > 0 ? "+" : v < 0 ? "−" : "±") + usd0.format(Math.abs(v));
  const signed2 = v => (v > 0 ? "+" : v < 0 ? "−" : "") + usd2.format(Math.abs(v));
  const pct = (v, d = 0) => v == null ? "—" : `${(v * 100).toFixed(d)}%`;
  const cents = v => v == null ? "—" : `${(v * 100).toFixed(v * 100 < 10 ? 1 : 0)}¢`;
  const when = iso => iso ? new Date(iso).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", timeZone: TZ }) + " ET" : "—";
  const clock = iso => iso ? new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ }) + " ET" : "—";
  const day = iso => iso ? new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: TZ }) : "—";
  const h = (tag, props = {}, ...kids) => {
    const e = document.createElement(tag);
    for (const k in props) {
      if (props[k] == null) continue;

  function drawRace() {
    raceBox.querySelectorAll("svg").forEach(x => x.remove());
    const series = (D.race || []).filter(r => S[r.name]).map(r => ({ ...r, pts: r.points.map(([t, v]) => ({ x: Date.parse(t), v })).filter(p => !Number.isNaN(p.x)) }));

    let lo = Math.min(D.start, ...all.map(p => p.v)), hi = Math.max(D.start, ...all.map(p => p.v));

    const two = h("div", { class: "two" });

  // ---------- scorecard ----------
  (function scorecard() {
    const cal = D.calibration || { sources: [], resolved: 0 };

        h("div", { class: "t" }, h("i", { style: `width:${(x.brier / top * 100).toFixed(1)}%;background:${colFor[x.name] || "var(--s0)"}` })),
        h("span", { class: "n", text: `${x.brier.toFixed(3)} · ${x.n}` }))));

    two.append(left);
    const right = h("div", { class: "panel" });
    right.append(h("h3", { text: "By category" }));
    const cats = ((D.learning || {}).by_category || []);
    if (cats.length) {
      const tb = h("table");
      const hr = h("tr"); [["Category"], ["Markets", 1], ["Jev + research", 1], ["Market", 1]].forEach(([x, nn]) => hr.append(h("th", { class: nn ? "n" : null, text: x })));
      tb.append(h("thead", {}, hr));
      const body = h("tbody");
      cats.forEach(c => body.append(h("tr", {}, h("td", { text: CAT[c.category] || c.category }), h("td", { class: "n", text: String(c.n) }),
        h("td", { class: "n", text: c.jev_research == null ? "—" : c.jev_research.toFixed(3) }), h("td", { class: "n", text: c.market == null ? "—" : c.market.toFixed(3) }))));
      tb.append(body);
      right.append(h("div", { class: "tablewrap" }, tb));
    } else right.append(empty("Where we beat the market, and where we don't.", "Sports, politics, crypto and the rest are scored separately, so the loop can see where research pays off."));
    two.append(right);
    sec.append(two);
  })();

  // ---------- this hour ----------
  (function thisHour() {
    const fn = D.funnel;
    const sec = block("Every hour", "Inside the last cycle", fn ? `Checked ${when(fn.ts)}. About 120 markets are fetched each hour; only a few are worth researching, and fewer are worth a bet.` : null, "cycle");
    if (!fn) { sec.append(empty("No cycle has run yet.", "")); return; }
    const two = h("div", { class: "two" });
    const left = h("div", { class: "panel" });

    const bets = Object.values(fn.bets || {}).reduce((a, b) => a + b, 0);
    const stages = [["Markets fetched", fn.stages[0][1]], ["Passed free filters", fn.stages[1][1]], ["Judged by Jev", fn.stages[2][1]], ["Judged with research", fn.stages[3][1]], ["Bets placed (all strategies)", bets]];
    const topN = Math.max(1, stages[0][1]);

    stages.forEach(([name, v], i) => bars.append(h("div", { class: "bar-row" }, h("span", { text: name }),
      h("div", { class: "t" }, h("i", { style: `width:${Math.max(v ? 1.5 : 0, v / topN * 100).toFixed(1)}%;background:${ramp[i]}` })), h("span", { class: "n", text: String(v) }))));
    left.append(bars);
    const bs = Object.entries(fn.bets || {}).filter(([k]) => S[k]);
    if (bs.length) {
      const row = h("div", { class: "decs", style: "display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px" });
      bs.forEach(([k, v]) => row.append(h("span", { class: "dec" }, h("span", { class: "sdot", style: `background:${col(k)}` }), document.createTextNode(`${label(k)}: ${v}`))));
      left.append(row);
    }
    left.append(h("span", { class: "muted", style: "font-size:12.5px", text: `Research: ${fn.researched_new} new, ${fn.research_reused} reused · facts kept ${fn.facts_kept}, removed by the price screen ${fn.facts_dropped}` + (fn.by_source ? ` · ${Object.entries(fn.by_source).map(([k, v]) => `${k === "polymarket" ? "Polymarket" : "Kalshi"} ${v}`).join(", ")}` : "") }));
    two.append(left);
    const right = h("div", { class: "panel" });
    right.append(h("h3", { text: "Running costs and health" }));
    const u = D.plan_usage;
    const kv = h("div", { class: "kv" },
      h("div", {}, h("b", { text: String(D.cycles_24h ?? "—") }), h("span", { text: "cycles in the last 24 hours" })),
      h("div", {}, h("b", { text: String(D.research_runs_today ?? 0) }), h("span", { text: "research runs today (cap 20)" })),
      h("div", {}, h("b", { text: u && u.week != null ? pct(u.week) : "—" }), h("span", { text: "of Joey's weekly Claude plan used" })));
    right.append(kv);
    right.append(h("span", { class: "muted", style: "font-size:12.5px", text: "Claude runs on a Claude subscription and Jev costs pennies: the trading itself costs nothing extra, and the money is fake." }));
    const probs = fn.problems || [];
    const pr = h("div", { class: "problems" });
    if (probs.length) probs.slice(0, 5).forEach(p => pr.append(h("div", {}, h("span", { class: "status", style: "color:var(--ink)" }, h("span", { class: "sdot", style: "background:var(--warning)" }), document.createTextNode("Problem")), h("span", { class: "muted", text: p }))));
    else pr.append(h("div", {}, h("span", { class: "status win" }, arrow(true), document.createTextNode("No problems")), h("span", { class: "muted", text: "in the last cycle" })));
    right.append(pr);
    two.append(right);

  // ---------- how to check ----------
  (function trust() {
    const sec = block("Receipts", "How to check this is real", null, "real");
    const p = h("div", { class: "panel trust" });

    p.append(
      para("The money is fake on purpose.", "Every bet is simulated. Nothing is bought or sold, and no account is connected."),

      para("The forecasters never see the price.", "Research is screened in code to remove odds, market prices and forecaster percentages before Jev or Claude reads it."),

    files.forEach(f => links.append(h("a", { href: base + f, target: base ? "_blank" : "_self", rel: "noopener noreferrer", text: f })));

  mi.append(h("footer", { text: `Fake money only: no accounts, no real orders. Research by Claude, forecasts by Jev (TypeSafe). Question set ${D.question_set}. Times in Eastern. Data refreshed every trading cycle, about hourly.` }));

  drawRace();
  celebrate(D, { usd0, signed2, label });
}

// Keep the countdowns ticking and the race chart sized to the screen.
function tick() {
  document.querySelectorAll("[data-close]").forEach(el => {
    const ms = Date.parse(el.dataset.close) - Date.now();
    const hrs = ms / 3600000;
    el.textContent = Number.isNaN(ms) ? "—" : ms <= 0 ? "closed" : hrs < 1 ? `${Math.max(1, Math.round(ms / 60000))}m` : hrs < 48 ? `${Math.floor(hrs)}h ${Math.floor((ms % 3600000) / 60000)}m` : `${Math.round(hrs / 24)}d`;
  });
  document.querySelectorAll("[data-close-l]").forEach(el => { if (Date.parse(el.dataset.closeL) <= Date.now()) el.textContent = "awaiting result"; });
}
setInterval(tick, 30000);
let resizeTimer = null, lastWidth = window.innerWidth;
window.addEventListener("resize", () => {
  if (Math.abs(window.innerWidth - lastWidth) < 40) return;
  lastWidth = window.innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => DATA && render(DATA), 200);
});

// A win that settled in the last two days gets confetti once per viewer (remembered in this browser only).
function celebrate(D, fmt) {
  const cutoff = Date.now() - 48 * 3600000;
  const wins = (D.settled_recent || []).filter(r => r.pnl > 0 && Date.parse(r.settled) > cutoff);
  if (!wins.length) return;
  let seen = [];
  try { seen = JSON.parse(localStorage.getItem("jev-celebrated") || "[]"); } catch (e) { seen = []; }
  const fresh = wins.filter(r => !seen.includes(`${r.strategy}:${r.key}`));
  if (!fresh.length || document.querySelector(".toast")) return;
  try { localStorage.setItem("jev-celebrated", JSON.stringify(seen.concat(fresh.map(r => `${r.strategy}:${r.key}`)).slice(-200))); } catch (e) { /* private window: celebrate anyway */ }
  const best = fresh.slice().sort((a, b) => b.pnl - a.pnl)[0];
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.setAttribute("role", "status");
  const msg = document.createElement("span");
  msg.textContent = `${fmt.label(best.strategy)} won ${fmt.signed2(best.pnl)} on "${best.question}"` + (fresh.length > 1 ? ` and ${fresh.length - 1} more` : "");
  const btn = document.createElement("button");
  btn.textContent = "Nice";
  btn.addEventListener("click", () => toast.remove());
  toast.append(msg, btn);
  document.body.append(toast);
  setTimeout(() => toast.remove(), 9000);
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas");
  cv.className = "confetti";
  document.body.append(cv);
  const dpr = window.devicePixelRatio || 1, W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr, ctx = cv.getContext("2d");
  const cs = getComputedStyle(document.documentElement);
  const colors = [1, 2, 3, 4, 5].map(i => cs.getPropertyValue(`--s${i}`).trim() || "#2a78d6");
  const bits = Array.from({ length: 140 }, () => ({ x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.35, vx: (Math.random() - 0.5) * 18 * dpr, vy: (-Math.random() * 14 - 6) * dpr,
    r: (4 + Math.random() * 5) * dpr, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.4, c: colors[Math.floor(Math.random() * colors.length)] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    bits.forEach(b => { b.vy += 0.5 * dpr; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.a += b.va;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = b.c; ctx.fillRect(-b.r / 2, -b.r / 4, b.r, b.r / 2); ctx.restore(); });
    if (t - t0 < 2600) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

// The public page loads the latest data from the GitHub repo each time it's opened, and falls back to
// the copy built into the page. Anything marked as example data is never shown there.
(function boot() {
  const EMBED = JSON.parse(document.getElementById("data").textContent);
  if (!EMBED.data_url || !EMBED.data_url.startsWith("https://")) return render(EMBED);
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 6000);
  fetch(EMBED.data_url, { signal: ctl.signal, cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
    .then(d => { if (d.example) throw new Error("example data"); render(Object.assign(d, { data_url: EMBED.data_url, ledger_base: d.ledger_base || EMBED.ledger_base, live: true })); })
    .catch(() => render(Object.assign(EMBED, { live: false })))
    .finally(() => clearTimeout(timer));
})();
