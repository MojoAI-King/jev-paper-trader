# Trading cycle about every half hour: settle -> scan -> review -> learn -> write summary.json -> commit the ledgers.
# The public page (Cloudflare) reads papertrade_data/summary.json straight from this repo, so no deploy is needed.
#
# Claude runs on Joey's Claude Max plan through Claude Code, signed in with CLAUDE_CODE_OAUTH_TOKEN
# (made once with `claude setup-token`). Never add ANTHROPIC_API_KEY here: it would switch Claude Code to
# API billing, and the code refuses to run research if it is set.
#
# Off until the repository variable TRADING_ENABLED is set to "true".
# Secrets needed: TYPESAFE_AI_API_KEY, CLAUDE_CODE_OAUTH_TOKEN.
# Once this is on, don't also run cycles on a laptop: two writers to the ledgers will conflict.
name: Trading cycle

on:
  schedule:
    # GitHub drops scheduled slots under load (on 2026-09-27 the :05 slot ran once in four hours, 45 minutes
    # late), so offer four slots an hour; the "due" step skips a slot if a cycle ran in the last 25 minutes.
    - cron: "8,23,38,53 * * * *"
  # Started by hand (runs a cycle), or by the Cloudflare cron trigger in worker/index.js (force: false,
  # so the "due" step applies). Cloudflare's triggers fire on time; GitHub's schedule above is the backup.
  workflow_dispatch:
    inputs:
      force:
        description: "Run a cycle even if one ran in the last 25 minutes"
        type: boolean
        default: true

concurrency:
  group: trading-cycle
  cancel-in-progress: false  # never cut a cycle off mid-run; the next one waits

permissions:
  contents: write  # to commit the ledgers

jobs:
  cycle:
    if: vars.TRADING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master  # the newest commit, not the one current when this run was queued, so the gate sees the last cycle

      - name: Due for a cycle?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else python3 -m papertrade due --minutes 25 >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.run == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.due.outputs.run == 'true'
        with:
          node-version: "22"

      - name: Install Claude Code
        if: steps.due.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Run the tests, then one trading cycle
        if: steps.due.outputs.run == 'true'
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 -m unittest discover -s tests -t . && python3 -m papertrade cycle

      - name: Commit the ledgers (the audit trail the page reads)
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "papertrade-bot"
          git config user.email "papertrade-bot@users.noreply.github.com"
          git add papertrade_data
          if git diff --cached --quiet; then echo "No ledger changes"; exit 0; fi
          git commit -m "Trading cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
