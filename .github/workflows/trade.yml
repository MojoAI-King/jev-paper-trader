# Hourly trading cycle: settle -> scan -> review -> commit the ledgers -> publish the page.
# Off until the repository variable TRADING_ENABLED is set to "true" (Settings -> Variables).
# Needs these repository secrets: TYPESAFE_AI_API_KEY, ANTHROPIC_API_KEY,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Once this is on, don't also run cycles on a laptop: two writers to the ledgers will conflict.
name: Trading cycle

on:
  schedule:
    - cron: "5 * * * *"  # hourly at :05 UTC; GitHub may start scheduled runs a few minutes late
  workflow_dispatch: {}

concurrency:
  group: trading-cycle
  cancel-in-progress: false  # never cut a cycle off mid-run; the next one waits

permissions:
  contents: write  # to commit the ledgers

jobs:
  cycle:
    if: vars.TRADING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run one trading cycle
        env:
          TYPESAFE_AI_API_KEY: ${{ secrets.TYPESAFE_AI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 -m unittest discover -s tests -t . && python3 -m papertrade cycle

      - name: Commit the ledgers (the audit trail)
        run: |
          git config user.name "papertrade-bot"
          git config user.email "papertrade-bot@users.noreply.github.com"
          git add papertrade_data
          if git diff --cached --quiet; then echo "No ledger changes"; exit 0; fi
          git commit -m "Trading cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - name: Publish the page to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
